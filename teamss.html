<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:url(https://images.augustman.com/wp-content/uploads/sites/5/2023/04/20190504/untitled-design-2023-04-16t071319-214.jpeg);
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
align-items:center;
}

header{
width:100%;
background:rgba(0,0,0,0.8);
padding:10px 0;
}

.navbar-nav a{
color:white;
font-weight:500;
}

h1{
margin:40px 0;
font-size:48px;
color:white;
letter-spacing:4px;
}

.container-teams{
width:90%;
max-width:1200px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:30px;
padding-bottom:50px;
}

.team{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:20px;
padding:20px;
text-align:center;
transition:0.4s;
cursor:pointer;
}

.team:hover{
transform:translateY(-10px) scale(1.05);
box-shadow:0 0 25px rgba(255,255,255,0.4);
}

.team img{
width:100px;
height:100px;
object-fit:contain;
}

.team h2{
margin-top:15px;
font-size:18px;
color:white;
}

.team:hover h2{
color:#00f2ff;
}

.search-box{
margin-bottom:30px;
width:300px;
}

footer{
width:100%;
background:black;
color:white;
text-align:center;
padding:15px;
margin-top:auto;
}

@media(max-width:768px){

h1{
font-size:34px;
}

.team img{
width:80px;
}

}

</style>
</head>

<script>

function searchTeams(){
let input=document.querySelector(".search-box").value.toLowerCase()
let teams=document.querySelectorAll(".team")

teams.forEach(team=>{
let text=team.innerText.toLowerCase()
team.style.display=text.includes(input)?"block":"none"
})
}

</script>
